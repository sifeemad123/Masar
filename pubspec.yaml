
name: masar
description: "Personal Application"
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.6.0
  collection: ^1.19.1
  flutter_slidable: ^4.0.3
  url_launcher: ^6.3.2
  animated_notch_bottom_bar: ^1.0.4
  crystal_navigation_bar: ^2.0.0
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Masar.png"

flutter:
  uses-material-design: true

  fonts:
    - family: ReadexPro-Regular
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
